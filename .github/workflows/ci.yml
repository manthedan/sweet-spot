name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --constraint requirements-dev.lock -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy sweetspot
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m unittest discover -s examples/stockfish -v

  opentofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/opentofu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.0
      - run: tofu fmt -check -recursive .
      - run: tofu init -backend=false -input=false -lockfile=readonly -no-color
      - run: tofu validate -no-color

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: docker build -f docker/Dockerfile.worker -t sweetspot-worker:ci .
      - run: docker run --rm sweetspot-worker:ci sweetspot --version
