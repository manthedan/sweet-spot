[project]
name = "sweetspot-runner"
version = "0.2.0.dev0"
description = "Run thousands of independent commands on AWS Batch Spot: cheap, retried, and verifiable."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "SweetSpot contributors"}]
keywords = ["aws", "aws-batch", "batch-processing", "s3", "spot-instances", "sqs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
]
dependencies = ["boto3>=1.35.10"]  # S3 conditional writes (If-None-Match)

[project.urls]
Homepage = "https://github.com/manthedan/sweet-spot"
Repository = "https://github.com/manthedan/sweet-spot"
Issues = "https://github.com/manthedan/sweet-spot/issues"

[project.optional-dependencies]
dev = ["mypy==1.14.1", "ruff==0.8.6", "moto[s3,sqs,batch,iam]>=5.0.20"]

[project.scripts]
sweetspot = "sweetspot.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sweetspot*"]

[tool.ruff]
line-length = 220
target-version = "py310"

[tool.ruff.lint]
select = ["F"]
ignore = []

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
